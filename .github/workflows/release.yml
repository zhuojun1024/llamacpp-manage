name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llamacpp-manage-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.yml

      # 仅打 tag 触发时创建 GitHub Release；手动触发只产出 artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # Windows runner 默认 cmd 不展开通配符，用 bash
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes release/*.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
